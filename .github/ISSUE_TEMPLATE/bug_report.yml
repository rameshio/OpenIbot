name: Bug Report
description: Create a report to help us improve OpenIbot
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please review agent logs if applicable.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: E.g., Windows 11, Windows 10
      placeholder: Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenIbot Version
      description: Which version are you using? (e.g. 0.1.0 or commit hash)
    validations:
      required: true
